<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://qlzx.lol/">
  <title>正在跳转…</title>
  <style>
    :root { color-scheme: light dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6f8;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #333;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #ddd; }
    }
    .box { text-align: center; padding: 40px 32px; }
    .spinner {
      width: 44px; height: 44px;
      margin: 0 auto 24px;
      border: 4px solid rgba(0,0,0,.12);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @media (prefers-color-scheme: dark) {
      .spinner { border-color: rgba(255,255,255,.15); border-top-color: #60a5fa; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { font-size: 16px; line-height: 1.6; }
    .msg a { color: #3b82f6; text-decoration: none; }
    .bar {
      width: 200px; height: 4px;
      margin: 20px auto 0;
      background: rgba(0,0,0,.1);
      border-radius: 2px;
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      .bar { background: rgba(255,255,255,.12); }
    }
    .bar-fill {
      height: 100%;
      width: 0;
      background: #3b82f6;
      border-radius: 2px;
      animation: fill 1.2s ease-out forwards;
    }
    @keyframes fill { to { width: 100%; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p class="msg">正在跳转到 <a href="https://qlzx.lol/">qlzx.lol</a> …</p>
    <div class="bar"><div class="bar-fill"></div></div>
  </div>
  <script>
    // 展示加载动画，1.2s 后跳转
    setTimeout(function () {
      location.replace("https://qlzx.lol/");
    }, 1200);
  </script>
</body>
</html>
